name: Trigger Job Scraper

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4,7,12 * * 2,3,4' # Tuesdays, Wednesdays, Thursdays at 9:30 AM, 12:30 PM, 5:30 PM IST (UTC 4:00 AM, 7:00 AM, 12:00 PM)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Debug Environment
        run: |
          echo "=== Current Directory ==="
          pwd
          ls -la
          echo "=== Python Version ==="
          python --version
          echo "=== Pip List ==="
          python -m pip list

      - name: Run Scraper and Send Email
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
        run: python test_email_run.py

      - name: Commit and Push sent_jobs.json (Deduplication Cache)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_jobs.json || true
          git commit -m "Update sent jobs cache [skip ci]" || true
          git push || true
